# /etc/nginx/sites-available/threattrove.com
# TLS certificates are expected from `certbot --nginx` (Let's Encrypt).

limit_req_zone $binary_remote_addr zone=tt_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tt_pages:10m rate=240r/m;

upstream threattrove_app {
    server 127.0.0.1:8080 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name threattrove.com www.threattrove.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://threattrove.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.threattrove.com;

    ssl_certificate     /etc/letsencrypt/live/threattrove.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threattrove.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    return 301 https://threattrove.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name threattrove.com;

    ssl_certificate     /etc/letsencrypt/live/threattrove.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threattrove.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/threattrove;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 4m;
    access_log /var/log/nginx/threattrove.access.log;
    error_log  /var/log/nginx/threattrove.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # static assets are served by Flask in dev; let nginx handle them in prod
    location /static/ {
        alias /opt/threattrove/threattrove/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # public JSON API: stricter limiter, no buffering issues
    location = /api/v1/bulk {
        limit_req zone=tt_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://threattrove_app;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=tt_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://threattrove_app;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=tt_pages burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://threattrove_app;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # slowloris protection
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    location = /favicon.ico { alias /opt/threattrove/threattrove/static/favicon.svg; }
    location = /robots.txt  { alias /var/www/threattrove/robots.txt; access_log off; }
    location = /health      { proxy_pass http://threattrove_app; access_log off; }
}
