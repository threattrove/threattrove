{% extends "base.html" %}

{% block title %}{{ code }} — {{ site_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:560px;margin:60px auto;text-align:center">
  <div class="mono" style="font-size:48px;color:var(--text-mute);letter-spacing:-.03em">{{ code }}</div>
  <h1 style="font-size:19px;margin:10px 0 14px">{{ message }}</h1>
  <p class="note">Check the indicator, or head back and try again.</p>
  <div class="form-actions" style="justify-content:center">
    <a class="btn" href="{{ url_for('index') }}">Back to search</a>
  </div>
</div>
{% endblock %}
