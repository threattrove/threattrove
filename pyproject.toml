[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threattrove"
version = "2.1.1"
description = "Self-hosted reputation lookup for file hashes, URLs, domains and IPs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "threattrove" }]
keywords = ["threat-intelligence", "malware", "hash", "virustotal", "ioc", "osint"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31,<3",
    "flask>=3.0,<4",
    "gunicorn>=21.2,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
threattrove = "threattrove.cli:main"
threattrove-web = "threattrove.web:main"

[project.urls]
Homepage = "https://threattrove.com"
Documentation = "https://threattrove.com/api"
Source = "https://threattrove.com"

[tool.setuptools]
packages = ["threattrove"]
include-package-data = true

[tool.setuptools.package-data]
threattrove = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
